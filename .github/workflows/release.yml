name: Release

on:
  push:
    tags:
      - "*/*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Parse tag
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG_SHORT="${TAG%/*}"
          VERSION="${TAG##*/}"
          PKG_DIR="net.nrzk.$PKG_SHORT"
          # Only the main spsndmf package claims the repo-wide "Latest" release;
          # the companion packages (vfstub, migrator) never take it over.
          if [ "$PKG_SHORT" = "spsndmf" ]; then MAKE_LATEST=true; else MAKE_LATEST=false; fi
          echo "PKG_SHORT=$PKG_SHORT" >> "$GITHUB_ENV"
          echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"

      - name: Run ReleaseTransform
        run: |
          SCRIPT="tools/$PKG_SHORT/ReleaseTransform.cs"
          if [ -f "$SCRIPT" ]; then
            dotnet run "$SCRIPT"
          else
            echo "No transform script at $SCRIPT; skipping"
          fi

      - name: Copy LICENSE into package
        run: |
          cp LICENSE.md "$PKG_DIR/LICENSE.md"
          # Derive a stable per-package GUID so LICENSE.md never collides
          # across net.nrzk.* packages installed side by side
          GUID=$(echo -n "$PKG_DIR/LICENSE.md" | md5sum | cut -c1-32)
          sed "s/^guid: .*/guid: $GUID/" .github/files/LICENSE.md.meta > "$PKG_DIR/LICENSE.md.meta"
          cat "$PKG_DIR/LICENSE.md.meta"

      - name: Set package info
        working-directory: ${{ env.PKG_DIR }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          cat package.json
          NAME=$(jq -r .name package.json)
          PREFIX="$NAME-$VERSION"
          {
            echo "NAME=$NAME"
            echo "PREFIX=$PREFIX"
            echo "PKG_ZIP=$PREFIX.zip"
            echo "VPAI_LATEST=$NAME-installer.unitypackage"
            echo "VPAI_LATEST_ZIP=$NAME-installer.zip"
            echo "VPAI_VERSION=$PREFIX-installer.unitypackage"
            echo "VPAI_VERSION_ZIP=$PREFIX-installer.zip"
          } >> "$GITHUB_ENV"

      - name: Create package zip
        working-directory: ${{ env.PKG_DIR }}
        run: zip -r "../$PKG_ZIP" .

      - name: Create VPAI latest
        uses: anatawa12/sh-actions/create-vpai@master
        with:
          repositories: |
            https://vpm.nadena.dev/vpm.json
            https://spsndmf.vpm.nrzk.net/index.json
          packages: ${{ env.NAME }}@^${{ env.VERSION }}
          output: ${{ env.VPAI_LATEST }}

      - name: Create VPAI version
        uses: anatawa12/sh-actions/create-vpai@master
        with:
          repositories: |
            https://vpm.nadena.dev/vpm.json
            https://spsndmf.vpm.nrzk.net/index.json
          packages: ${{ env.NAME }}@${{ env.VERSION }}
          output: ${{ env.VPAI_VERSION }}

      - name: Zip VPAI installers
        run: |
          zip "$VPAI_LATEST_ZIP" "$VPAI_LATEST"
          zip "$VPAI_VERSION_ZIP" "$VPAI_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: ${{ env.MAKE_LATEST }}
          files: |
            ${{ env.PKG_ZIP }}
            ${{ env.VPAI_LATEST_ZIP }}
            ${{ env.VPAI_VERSION_ZIP }}
            ${{ env.PKG_DIR }}/package.json
